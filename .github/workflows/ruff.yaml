name: Ruff
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.17.3"
          args: "format --check"
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.17.3"
          args: "check"
