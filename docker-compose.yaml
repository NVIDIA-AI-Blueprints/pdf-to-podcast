services:
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    command: redis-server --appendonly no
    networks:
      - app-network

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - ./data/minio:/data
    command: minio server /data --console-address ":9001"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 5

  api-service:
    build:
      context: .
      dockerfile: services/APIService/Dockerfile
    ports:
      - "8002:8002"
    environment:
      - PDF_SERVICE_URL=http://pdf-service:8003
      - AGENT_SERVICE_URL=http://agent-service:8964
      - TTS_SERVICE_URL=http://tts-service:8889
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
      - pdf-service
      - agent-service
      - tts-service
      - jaeger
    networks:
      - app-network

  agent-service:
    build:
      context: .
      dockerfile: services/AgentService/Dockerfile
    ports:
      - "8964:8964"
    environment:
      # XPU: default "local" so no real NVIDIA key is required when models.json
      # points at a local vLLM-XPU / SGLang-XPU endpoint.
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-local}
      - REDIS_URL=redis://redis:6379
      - MODEL_CONFIG_PATH=/app/config/models.json
    volumes:
      - ./models.json:/app/config/models.json
    # XPU: reach the vLLM-XPU server running on the host (models.json uses
    # http://host.docker.internal:8100).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    networks:
      - app-network

  pdf-service:
    build:
      context: .
      dockerfile: services/PDFService/Dockerfile
    ports:
      - "8003:8003"
    environment:
      - REDIS_URL=redis://redis:6379
      - MODEL_API_URL=${MODEL_API_URL:-http://pdf-api:8004}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    networks:
      - app-network

  tts-service:
    build:
      context: .
      dockerfile: services/TTSService/Dockerfile
    ports:
      - "8889:8889"
    environment:
      - MAX_CONCURRENT_REQUESTS=${MAX_CONCURRENT_REQUESTS:-2}
      - REDIS_URL=redis://redis:6379
      # XPU: Parler-TTS device. "cpu" is portable and always works; set
      # TTS_DEVICE=xpu only on a host whose Level Zero UMD matches the kernel
      # driver (see XPU_MIGRATION.md). "auto" falls back cpu if no XPU.
      - TTS_DEVICE=${TTS_DEVICE:-cpu}
      - TTS_MODEL=${TTS_MODEL:-parler-tts/parler-tts-mini-v1}
      # HF cache + proxy for the first-run model download (empty by default).
      - HF_HOME=${HF_HOME:-/data/hf-cache}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,redis}
    # XPU: pre-downloaded HF cache mount (host path -> container HF_HOME).
    volumes:
      - ${HF_CACHE_DIR:-./data/hf-cache}:/data/hf-cache
    depends_on:
      - redis
    networks:
      - app-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" # UI
      - "4317:4317" # OTLP GRPC
      - "4318:4318" # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    healthcheck:
      test: ["CMD", "wget", "--spider", "localhost:16686"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - app-network
  
  pdf-api:
    build:
      context: services/PDFService/PDFModelService
      dockerfile: Dockerfile.api
    ports:
      - "8004:8004"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TEMP_FILE_DIR=/tmp/pdf_conversions
    volumes:
      - pdf_temp:/tmp/pdf_conversions
    depends_on:
      - redis
      - celery-worker
    restart: unless-stopped
    networks:
      - app-network

  celery-worker:
    build:
      context: services/PDFService/PDFModelService
      dockerfile: Dockerfile.worker
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - TEMP_FILE_DIR=/tmp/pdf_conversions
      # XPU: proxy for Docling's first-run layout-model download (empty by
      # default; set on proxied hosts). Docling parses on CPU — no device
      # mounts needed here.
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,redis}
    volumes:
      - pdf_temp:/tmp/pdf_conversions
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - app-network

volumes:
  redis_data:
  pdf_temp:

networks:
  app-network:
    driver: bridge
